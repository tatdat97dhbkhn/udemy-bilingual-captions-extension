<!doctype html>
<html lang="vi">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Udemy captions</title><style>body{font:14px system-ui;margin:16px;width:300px}label{display:block;margin:10px 0 4px}input{box-sizing:border-box;width:100%;padding:7px}button{margin:12px 8px 0 0;padding:7px 10px}#diagnostic{color:#555;font-size:12px;margin-top:12px}</style></head>
  <body>
    <label><input id="enabled" type="checkbox" /> Bật dịch phụ đề</label>
    <label for="provider">Nhà cung cấp dịch</label>
    <select id="provider"><option value="openai">OpenAI</option><option value="libretranslate">LibreTranslate</option></select>
    <label id="api-key-label" for="api-key">OpenAI API key</label><input id="api-key" type="password" autocomplete="off" />
    <div id="openai-fields">
      <label for="model">Model</label><input id="model" value="gpt-4o-mini" />
    </div>
    <div id="libretranslate-fields" hidden>
      <label for="libretranslate-endpoint">URL máy chủ LibreTranslate</label><input id="libretranslate-endpoint" type="url" placeholder="http://localhost:5000" autocomplete="off" />
      <div id="libretranslate-help">API key là tùy chọn; chỉ nhập nếu máy chủ của bạn yêu cầu.</div>
    </div>
    <button id="save">Lưu</button><button id="clear-cache">Xóa cache</button>
    <div id="diagnostic"></div><style>select{box-sizing:border-box;width:100%;padding:7px}#libretranslate-help{color:#555;font-size:12px;margin-top:6px}</style><script type="module" src="/src/popup/main.ts"></script>
  </body>
</html>
